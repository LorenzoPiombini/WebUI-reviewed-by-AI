<!doctype html>
<html lang="en">
<head>
	<link rel="stylesheet" href="style.css">
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Customers - BSM</title>
	<script type="module" src="script.js"></script>
</head>
<body>
	<nav class="sidenav" role="navigation" aria-label="Main navigation">
		<a href="index.html">🏠 Dashboard</a>
		<a href="sales_orders.html">📋 Sales Orders</a>
		<a href="purchase_orders.html">🛒 Purchase Orders</a>
		<a href="account_receivable.html">💰 Account Receivable</a>
		<a href="account_payable.html">💳 Account Payable</a>
		<a href="inventory.html" class ="active">🏷️ Inventory</a>
		<a href="general_ledger.html">📊 General Ledger</a>
		<a href="customers.html">👥 Customers</a>
		<div class="sidenav-settings">
			<a href="#" class="settings-link" id="settings-link">⚙️ Settings</a>
		</div>
	</nav>
	<main class="main" id="root">
		<div class="page-header">
			<h1>Inventory</h1>
			<p>Mange your inventory</p>
		</div>
		<div id="card-header">
			<button class="button success" id="new-item">➕ New Item</button>
			<button class="button" id="edit-item">✏️ Edit Item</button>
		</div>
		<div id="hidden-root-new-item" style="display: none;" class="card fade-in">
			<div class="card-header">New Item</div>
			<div class="form-section">
				<div class="form-grid">
					<div class="form-group">
						<label for="item-name" class="">Name</label>
						<input id="item-name" type="text" class="input_2px_border" autocomplete="off" title="name(ake code)of your new item">
					</div>
					<div class="form-group">
						<label for="item-uom" class="">Unit of Measure</label>
						<input id="item-uom" type="text" class="input_2px_border" autocomplete="off" title="unit of measure for this item">
					</div>
					<div class="form-group">
						<label for="item-price-level">Price Level</label>
						<input id="item-price-level" type="text" class="input_2px_border" autocomplete="off" title="Price discount point">
					</div>

					<div class="form-group">
						<label for="item-u-price">Unit price</label>
						<input id="item-u-price" type="number" step="0.01" class="input_2px_border" autocomplete="off">
					</div>
					<div style="margin-top:31px;">
						<button class="button" id="submit-item">Save</button>
					</div>
				</div>
			</div>
		</div>
		<div id="hidden-root-edit-item">
		</div>
	</main>
	
	<!-- Settings Modal -->
	<div class="settings-modal" id="settings-modal">
		<div class="settings-modal-content">
			<div class="settings-modal-header">
				<h2>Settings</h2>
				<button class="settings-close" id="settings-close">&times;</button>
			</div>
			
			<div class="settings-section">
				<div class="settings-section-title">Theme</div>
				<div class="settings-option">
					<div class="settings-option-label">Color Theme</div>
					<div class="theme-selector">
						<button class="theme-option active" data-theme="light">Light</button>
						<button class="theme-option" data-theme="dark">Dark</button>
					</div>
				</div>
			</div>
			
			<div class="settings-section">
				<div class="settings-section-title">Other Settings</div>
				<p style="color: var(--text-secondary); font-size: var(--font-size-sm);">More settings coming soon...</p>
			</div>
		</div>
	</div>
</body>
</html>
